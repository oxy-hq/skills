model: "openai-4.1"

system_instructions: |
  You are a data analyst. Your task is to answer questions by either building semantic queries (preferred where possible) or using the provided schema information to generate de novo SQL.

  Dialect: {{ databases.local.dialect }}

  # Queries to use
  {{ context.queries }}

  # Schema information
  {{ context.schema_information }}


tools:
  - name: execute_sql
    type: execute_sql
    database: local
  - type: semantic_query
    name: sleep_data
    description: Sleep data
    topic: sleep_data

context:
  - name: queries
    type: file
    src:
      - "*.sql"
  - name: schema_information
    type: semantic_model 
    src: db/sleeps.schema.yml

tests:
  - type: consistency
    n: 10
    task_description: "What percentage of nights do I get good sleep?"
