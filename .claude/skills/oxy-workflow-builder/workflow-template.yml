# Oxy Workflow Template
# Workflows orchestrate multi-step data operations (ETL, aggregation pipelines, etc.)

name: my_workflow_name
description: "Brief description of what this workflow accomplishes and why it exists"

# Steps execute sequentially
steps:
  # Step 1: Extract data
  - name: extract_data
    description: "Extract raw data from source table"
    sql: |
      SELECT
        column1,
        column2,
        column3,
        timestamp_column
      FROM {{ databases.database_name.schema_name }}.source_table
      WHERE date = '{{ date }}'
        AND status NOT IN ('cancelled', 'test')
      ORDER BY timestamp_column

  # Step 2: Transform data
  - name: transform_data
    description: "Clean and transform extracted data"
    sql: |
      SELECT
        TRIM(column1) as column1,
        UPPER(column2) as column2,
        CAST(column3 as DECIMAL(10,2)) as column3,
        DATE(timestamp_column) as date
      FROM {{ steps.extract_data.result }}
      WHERE column3 > 0

  # Step 3: Aggregate data
  - name: aggregate_data
    description: "Aggregate transformed data by key dimensions"
    sql: |
      SELECT
        column1,
        column2,
        DATE(date) as date,
        COUNT(*) as record_count,
        SUM(column3) as total_amount,
        AVG(column3) as avg_amount
      FROM {{ steps.transform_data.result }}
      GROUP BY
        column1,
        column2,
        DATE(date)

  # Step 4: Load data
  - name: load_data
    description: "Load aggregated data to destination table"
    sql: |
      INSERT INTO {{ databases.database_name.schema_name }}.destination_table
      SELECT * FROM {{ steps.aggregate_data.result }}

# Usage:
#   oxy run my_workflow_name.workflow.yml
#
# Best Practices:
# - Name steps descriptively (extract, transform, load, aggregate, etc.)
# - Add clear descriptions for each step
# - Reference previous steps with {{ steps.step_name.result }}
# - Test each step's SQL separately before combining
# - Keep workflows focused on a single pipeline
# - Document what the workflow accomplishes
#
# Common Patterns:
# - ETL: extract → transform → load
# - Aggregation: extract → aggregate → load
# - Multi-stage: extract → clean → enrich → aggregate → load
